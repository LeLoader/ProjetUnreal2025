name: AutomatedBuild
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "master" ]

    workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    name: Package Unreal Engine Game
    timeout-minutes: 5
    steps:
        - name: Checkout code
          uses: actions/checkout@v3
        
        - name: Package Project
          env: 
            UE_PATH: 'C:\Program Files\Epic Games\UE_5.5' # Path to your Unreal Engine installation
            PROJECT_PATH: 'C:\dev\UnrealEngine\Projects\ProjetUnreal2025\ProjetUnreal2025.uproject' # Path to your Unreal project file
            OUTPUT_PATH: 'C:\Users\leloa\Desktop\TestBuild' # Path to where you want to store the packaged game
          run: |
            & $env:UE_PATH\Engine\Build\BatchFiles\RunUAT.bat BuildCookRun -project="$env:PROJECT_PATH" -noP4 -platform=Win64 -clientconfig=Development -serverconfig=Development -cook -map='FishMap' -build -stage -pak -archive -archivedirectory="$env:OUTPUT_PATH"
